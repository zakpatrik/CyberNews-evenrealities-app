name: feed

# Fetching happens here rather than in the Cloudflare Worker because
# BleepingComputer and CybersecurityNews both refuse requests coming from
# Cloudflare's network. Runners are ordinary hosts, so the feeds answer normally.
on:
  schedule:
    # Hourly. GitHub delays scheduled runs under load, so treat this as "about
    # once an hour" rather than on the hour.
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fetcher/**'
      - '.github/workflows/feed.yml'

permissions:
  contents: write

# A manual run firing next to a scheduled one would race on the same commit.
concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Extraction adds ~20 article page fetches and a jsdom parse for each.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install fetcher deps
        working-directory: fetcher
        run: npm ci || npm install

      - name: Build feed.json and articles.json
        run: node fetcher/build-feed.mjs --out feed.json --articles articles.json --limit 60

      - name: Commit when the feed changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Never rebase these. Both sides regenerate the whole file, so a
          # concurrent run guarantees a conflict that has no meaningful
          # resolution — the newest content simply wins. Replay the generated
          # files as one commit on top of whatever the remote currently is.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --mixed "origin/${GITHUB_REF_NAME}"
            git add feed.json articles.json

            if git diff --cached --quiet; then
              echo "No change."
              exit 0
            fi

            git commit -m "feed: $(node -e "console.log(require('./feed.json').count)") items, $(node -e "console.log(require('./articles.json').count)") with full text"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push raced with another run, retrying ($attempt/3)."
          done
          echo "Could not push after 3 attempts."
          exit 1
